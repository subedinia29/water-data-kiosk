<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Water Data Help Desk</title>
<style>
  :root { --fg:#111; --bg:#fff; --muted:#555; --line:#ccc; --warn:#fff3cd; --bad:#f8d7da; --ok:#e7f1ff; }
  * { box-sizing: border-box; }
  body { margin:0; font: 18px/1.5 system-ui, sans-serif; color:var(--fg); background:var(--bg); }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  button, input, textarea { font: inherit; padding: 10px 14px; min-height: 48px; }
  button { cursor: pointer; }
  input[type=text], textarea { width: 100%; border:1px solid var(--line); border-radius:6px; }
  .banner { padding:10px 14px; border-radius:6px; margin:8px 0; }
  .warn { background:var(--warn); } .bad { background:var(--bad); } .ok { background:var(--ok); }
  .card { border:1px solid var(--line); border-radius:8px; padding:14px; margin:12px 0; }
  .cite { font-size:15px; color:var(--muted); border-top:1px dashed var(--line); margin-top:8px; padding-top:6px; }
  .cta { font-weight:600; font-size:20px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  footer { font-size:14px; color:var(--muted); border-top:1px solid var(--line); margin-top:24px; padding-top:12px; }
  .layout { display:block; }
  @media (min-width: 900px) { .layout { display:grid; grid-template-columns: 380px 1fr; gap:24px; } }
  table { border-collapse: collapse; width:100%; font-size:15px; } td, th { border:1px solid var(--line); padding:6px; text-align:left; vertical-align:top; }
  .hidden { display:none; }
  @media print { .no-print { display:none !important; } .print-only { display:block !important; } body { font-size:14px; } }
  .print-only { display:none; }
</style>
</head>
<body>
<main id="app"></main>
<script src="data.js"></script>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
