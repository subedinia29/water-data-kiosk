<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Water and Soil Test Results</title>
<style>
/* Water & Soil Test Results kiosk — large text, high contrast, big tap targets.
   All colors are set here as tokens. Text/background pairs meet WCAG AAA (7:1) or better. */
:root {
  --bg: #ffffff;
  --fg: #111111;
  --muted: #333333;
  --line: #4a4a4a;
  --soft: #f2f4f7;
  --primary: #0a3a85;     /* white text on this: about 11:1 */
  --primary-fg: #ffffff;
  --primary-hover: #072a61;
  --focus: #ffbf00;
  --note-bg: #fff4cc;     /* notes, dates, "data is old" */
  --note-line: #8a6d00;
  --stop-bg: #fde7e7;     /* "a person can help" referral cards */
  --stop-line: #a30000;
  --info-bg: #e6eefc;
  --info-line: #0a3a85;
  --flag-bg: #ffe2c2;     /* agencies disagree */
  --flag-line: #9a4a00;
  --link: #0a3a85;
  --radius: 12px;
  font-size: 125%;        /* 20px base. Text-size buttons raise this. */
}
:root[data-size="2"] { font-size: 150%; }
:root[data-size="3"] { font-size: 175%; }

/* High contrast: white and yellow on black. */
:root[data-contrast="high"] {
  --bg: #000000;
  --fg: #ffffff;
  --muted: #ffffff;
  --line: #ffffff;
  --soft: #000000;
  --primary: #ffff00;
  --primary-fg: #000000;
  --primary-hover: #ffffff;
  --focus: #00ffff;
  --note-bg: #000000; --note-line: #ffff00;
  --stop-bg: #000000; --stop-line: #ff8080;
  --info-bg: #000000; --info-line: #80b3ff;
  --flag-bg: #000000; --flag-line: #ffb366;
  --link: #ffff00;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: Verdana, "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  font-size: 1rem;
  line-height: 1.6;
  color: var(--fg);
  background: var(--bg);
}
h1 { font-size: 1.6rem; line-height: 1.25; margin: 0.4em 0 0.4em; }
h2 { font-size: 1.3rem; line-height: 1.3; margin: 1.2em 0 0.5em; }
h3 { font-size: 1.1rem; line-height: 1.3; margin: 1em 0 0.4em; }
p { margin: 0.5em 0; }
a { color: var(--link); text-decoration-thickness: 2px; text-underline-offset: 3px; }
strong { font-weight: 700; }

:focus-visible { outline: 4px solid var(--focus); outline-offset: 3px; }

.skip { position: absolute; left: -9999px; }
.skip:focus { left: 16px; top: 8px; background: var(--bg); color: var(--fg); padding: 12px; z-index: 10; }

/* ---------- Top bar ---------- */
.topbar { background: var(--primary); color: var(--primary-fg); border-bottom: 3px solid var(--line); }
.topbar-inner { max-width: 1200px; margin: 0 auto; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.brand { display: flex; flex-direction: column; }
.brand-title { font-size: 1.15rem; font-weight: 700; line-height: 1.2; }
.brand-sub { font-size: 0.85rem; }
.display { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.display-label { font-size: 0.85rem; margin-right: 2px; }
.display button {
  min-height: 48px; min-width: 48px; padding: 4px 10px;
  font: inherit; font-size: 0.9rem; font-weight: 700;
  background: var(--primary-fg); color: var(--primary);
  border: 2px solid var(--primary-fg); border-radius: 8px; cursor: pointer;
}
.display button[aria-pressed="true"] { outline: 3px solid var(--focus); outline-offset: 1px; }

main { max-width: 1200px; margin: 0 auto; padding: 8px 16px 24px; }
main:focus { outline: none; }

/* ---------- Buttons ---------- */
.btn, button.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.4em;
  min-height: 56px; padding: 10px 18px;
  font: inherit; font-weight: 700; line-height: 1.25; text-align: center;
  color: var(--primary); background: var(--bg);
  border: 3px solid var(--primary); border-radius: var(--radius);
  cursor: pointer;
}
.btn:hover { background: var(--soft); }
.btn.primary { background: var(--primary); color: var(--primary-fg); }
.btn.primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
.btn.wide { width: 100%; }
.row { display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 0; }
.row > .btn { flex: 1 1 auto; }

/* ---------- Topics and questions ---------- */
.topics { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 12px 0; }
.topic {
  min-height: 72px; padding: 10px 12px;
  font: inherit; font-weight: 700; line-height: 1.25; text-align: left;
  color: var(--fg); background: var(--soft);
  border: 3px solid var(--line); border-radius: var(--radius); cursor: pointer;
  display: flex; flex-direction: column; justify-content: center;
}
.topic small { font-weight: 400; font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
.topic[aria-expanded="true"] { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
.topic[aria-expanded="true"] small { color: var(--primary-fg); }
.topic.warn-topic { border-color: var(--stop-line); }

.questions { border: 3px solid var(--primary); border-radius: var(--radius); padding: 12px; margin: 8px 0 16px; background: var(--bg); }
.questions h2 { margin-top: 0; }
.q-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.q-btn {
  width: 100%; min-height: 60px; padding: 10px 14px;
  font: inherit; text-align: left; line-height: 1.35;
  color: var(--fg); background: var(--bg);
  border: 2px solid var(--line); border-radius: var(--radius); cursor: pointer;
  display: flex; gap: 10px; align-items: center;
}
.q-btn::before { content: "›"; font-size: 1.6rem; line-height: 1; color: var(--primary); font-weight: 700; }
.q-btn:hover { background: var(--soft); }

label { display: block; font-weight: 700; margin: 12px 0 6px; }
textarea, input[type=text], select {
  width: 100%; min-height: 56px; padding: 10px 12px;
  font: inherit; color: var(--fg); background: var(--bg);
  border: 3px solid var(--line); border-radius: var(--radius);
}
.panel-box { border-top: 3px solid var(--line); margin-top: 18px; padding-top: 6px; }
.hint { color: var(--muted); font-size: 0.9rem; }

/* ---------- Layout: phone first, two columns on wide screens ---------- */
.layout { display: block; }
@media (min-width: 960px) {
  .layout { display: grid; grid-template-columns: minmax(360px, 440px) 1fr; gap: 32px; align-items: start; }
  .ask-panel { position: sticky; top: 8px; max-height: calc(100vh - 16px); overflow-y: auto; padding-right: 8px; }
  .back-to-topics { display: none !important; }
}

/* ---------- Results ---------- */
.you-asked { font-size: 1.1rem; margin: 8px 0; padding: 10px 14px; border-left: 6px solid var(--primary); background: var(--soft); }
.banner { padding: 12px 14px; border-radius: var(--radius); margin: 10px 0; border: 2px solid; }
.banner.date { background: var(--note-bg); border-color: var(--note-line); }
.banner.info { background: var(--info-bg); border-color: var(--info-line); }
.banner.stop { background: var(--stop-bg); border-color: var(--stop-line); }
.banner p { margin: 0.2em 0; }

.card { border: 2px solid var(--line); border-radius: var(--radius); padding: 14px; margin: 12px 0; background: var(--bg); }
.card.stop { background: var(--stop-bg); border: 3px solid var(--stop-line); }
.card.flag { background: var(--flag-bg); border: 3px solid var(--flag-line); }
.card.fact { border: 3px solid var(--info-line); }
.card h2, .card h3 { margin-top: 0; }

.result-card .chem { font-size: 1.15rem; font-weight: 700; margin: 0 0 4px; }
.facts { margin: 6px 0; display: grid; grid-template-columns: max-content 1fr; gap: 2px 14px; }
.facts dt { font-weight: 700; }
.facts dd { margin: 0; }
.big-result { font-size: 1.2rem; font-weight: 700; }
.flag-badge { display: inline-block; margin: 4px 0; padding: 2px 10px; border: 2px solid var(--flag-line); background: var(--flag-bg); border-radius: 999px; font-weight: 700; font-size: 0.9rem; }
@media (max-width: 420px) { .facts { grid-template-columns: 1fr; } .facts dd { margin-bottom: 6px; } }

.place-head { border-bottom: 3px solid var(--line); padding-bottom: 4px; }

.cite { font-size: 0.9rem; color: var(--muted); border-top: 2px dashed var(--line); margin-top: 10px; padding-top: 8px; }
.cite p { margin: 0.15em 0; }
.cite .stale { background: var(--note-bg); border: 2px solid var(--note-line); color: var(--fg); padding: 6px 10px; border-radius: 8px; margin-bottom: 6px; }

details.history { margin: 16px 0; }
details.history > summary, details.more > summary {
  list-style: none; cursor: pointer;
  min-height: 56px; padding: 12px 16px;
  font-weight: 700; color: var(--primary); background: var(--bg);
  border: 3px solid var(--primary); border-radius: var(--radius);
  display: flex; align-items: center; gap: 10px;
}
details.history > summary::-webkit-details-marker, details.more > summary::-webkit-details-marker { display: none; }
details.history > summary::before, details.more > summary::before { content: "+"; font-size: 1.4rem; line-height: 1; }
details.history[open] > summary::before, details.more[open] > summary::before { content: "–"; }
details.history[open] > summary .when-closed { display: none; }
details.history:not([open]) > summary .when-open { display: none; }

.words { border: 2px solid var(--info-line); background: var(--info-bg); border-radius: var(--radius); padding: 10px 14px; margin: 16px 0; }
.words h2 { margin-top: 0.2em; font-size: 1.15rem; }
.words dl { margin: 0; }
.words dt { font-weight: 700; margin-top: 8px; }
.words dd { margin: 0; }

/* ---------- Footer on every screen ---------- */
.site-footer { border-top: 3px solid var(--line); margin-top: 28px; padding-top: 12px; }
.help-bar { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.help-bar .print-cta { grid-column: 1 / -1; font-size: 1.1rem; min-height: 64px; }
@media (min-width: 700px) { .help-bar { grid-template-columns: 2fr 1fr 1fr 1fr; } .help-bar .print-cta { grid-column: auto; } }
.disclaimer { font-size: 0.9rem; color: var(--muted); }
.sample-note { font-weight: 700; }
.staff-link { font-size: 0.85rem; }

/* ---------- Staff page ---------- */
.staff .btn.on { background: var(--stop-bg); color: var(--fg); border-color: var(--stop-line); }
.status-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.status { border: 2px solid var(--line); border-radius: var(--radius); padding: 10px 14px; }
.status .big { font-size: 1.4rem; font-weight: 700; }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
td, th { border: 1px solid var(--line); padding: 8px; text-align: left; vertical-align: top; }
td input[type=checkbox] { width: 28px; height: 28px; }

/* ---------- Report dialog ---------- */
dialog { max-width: 560px; width: calc(100% - 32px); border: 3px solid var(--line); border-radius: var(--radius); padding: 16px 20px; color: var(--fg); background: var(--bg); }
dialog::backdrop { background: rgba(0, 0, 0, 0.6); }
.choice-list { display: grid; gap: 8px; }
.choice { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 12px; margin: 0; border: 2px solid var(--line); border-radius: var(--radius); font-weight: 400; cursor: pointer; }
.choice input { width: 28px; height: 28px; flex: none; }

#toast { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); max-width: calc(100% - 32px);
  background: var(--fg); color: var(--bg); padding: 12px 18px; border-radius: var(--radius); font-weight: 700; display: none; z-index: 20; }
#toast.show { display: block; }

/* ---------- Print: just the answer, sources, disclaimer and space for notes ---------- */
.print-only { display: none; }
@media print {
  :root, :root[data-size], :root[data-contrast] { font-size: 12pt; --bg: #fff; --fg: #000; --muted: #000; --line: #000; --soft: #fff;
    --note-bg: #fff; --stop-bg: #fff; --info-bg: #fff; --flag-bg: #fff; --link: #000; --primary: #000; }
  .no-print, .topbar, #toast, dialog { display: none !important; }
  .print-only { display: block !important; }
  .layout { display: block; }
  .ask-panel { display: none; }
  .card, .banner { break-inside: avoid; }
  details.history > summary { border: none; padding: 0; min-height: 0; }
  details.history > summary::before { content: ""; }
  .print-head { border-bottom: 2px solid #000; padding-bottom: 6px; margin-bottom: 8px; }
  .notes-lines { border-top: 1px solid #000; height: 1.6em; }
}

/* High contrast top bar: black, with yellow buttons. */
:root[data-contrast="high"] .topbar { background: #000; color: #fff; border-bottom-color: #ffff00; }
:root[data-contrast="high"] .display button { background: #ffff00; color: #000; border-color: #ffff00; }

</style>
<!-- EXTRA FEATURES (Project 3.2). To remove: delete this line and the 4 script lines below marked EXTRA FEATURES, then the features/ folder. -->
<style>
/* EXTRA FEATURES (Project 3.2) styles. Uses the color tokens from ../styles.css. */
.choice-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); margin: 12px 0; }
.feature-card { border: 3px solid var(--info-line); }
.ai-note { border-width: 3px; }
.ticket { text-align: center; border: 4px solid var(--primary); }
.ticket-num { font-size: 4rem; font-weight: 700; line-height: 1.1; margin: 0.1em 0; color: var(--primary); }
.mic[aria-pressed="true"] { background: var(--stop-bg); border-color: var(--stop-line); color: var(--fg); }
@media print { .ticket-num { font-size: 48pt; color: #000; } }

</style>
</head>
<body>
<a class="skip" href="#app">Skip to main content</a>

<header class="topbar no-print">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-title">Water &amp; Soil Test Results</span>
      <span class="brand-sub">East Palestine Memorial Public Library</span>
    </div>
    <div class="display" role="group" aria-label="Screen settings">
      <span class="display-label" id="size-label">Text size</span>
      <button type="button" class="size-btn" data-size="1" aria-describedby="size-label" aria-label="Normal text">A</button>
      <button type="button" class="size-btn" data-size="2" aria-describedby="size-label" aria-label="Bigger text">A+</button>
      <button type="button" class="size-btn" data-size="3" aria-describedby="size-label" aria-label="Biggest text">A++</button>
      <button type="button" class="contrast-btn" data-action="contrast" aria-pressed="false">High contrast</button>
    </div>
  </div>
</header>

<div class="print-only print-head">
  <strong>Water &amp; Soil Test Results — East Palestine Memorial Public Library</strong><br>
  Printed <span id="print-date"></span>. Bring this page to the reference desk. A librarian can help you read it.
</div>

<main id="app" tabindex="-1"></main>

<!-- Report a problem (FR-15). A big, simple form instead of a pop-up text box. -->
<dialog id="report-dialog" aria-labelledby="report-title">
  <form method="dialog" id="report-form">
    <h2 id="report-title">Report a problem</h2>
    <p>What went wrong? Tap one.</p>
    <div class="choice-list">
      <label class="choice"><input type="radio" name="what" value="The answer looks wrong" checked> The answer looks wrong</label>
      <label class="choice"><input type="radio" name="what" value="It did not understand my question"> It did not understand my question</label>
      <label class="choice"><input type="radio" name="what" value="It was hard to read or use"> It was hard to read or use</label>
      <label class="choice"><input type="radio" name="what" value="Something else"> Something else</label>
    </div>
    <label for="report-note">Anything else? (Optional. Please do not write your name or address.)</label>
    <textarea id="report-note" rows="3"></textarea>
    <div class="row">
      <button type="submit" value="send" class="btn primary">Send report</button>
      <button type="submit" value="cancel" class="btn">Cancel</button>
    </div>
  </form>
</dialog>

<div id="toast" role="status" aria-live="polite"></div>

<script>
// SAMPLE DATA ONLY. Every record below is made up for development.
// Real agency data will be parsed into this same shape later (see ../DECISIONS.md).
//
// This is the ONE file to swap when real data arrives. The screens and the
// question logic read everything from here. Keep the field names the same.
const DATA = {
  corpusVersion: "0.2.0-sample",
  corpusUpdated: "2026-09-15",
  isSample: true,

  // Source documents (FR-1 closed corpus). cadenceDays = expected update interval (FR-18).
  // A document needs a `link` or a `shelf` location, or it won't be shown.
  documents: [
    { id: "D1", title: "East Palestine Surface Water Sampling Results (sample)", agency: "U.S. EPA",
      published: "2026-08-01", cadenceDays: 90, link: "https://www.epa.gov/east-palestine-oh-train-derailment/water-sampling-data", shelf: "Binder A, tab 1" },
    { id: "D2", title: "Ohio EPA Stream Monitoring Summary (sample)", agency: "Ohio EPA",
      published: "2026-07-10", cadenceDays: 90, link: "", shelf: "Binder A, tab 2" },
    { id: "D3", title: "Columbiana County Private Well Testing Results (sample)", agency: "Columbiana County Health District",
      published: "2026-03-01", cadenceDays: 90, link: "", shelf: "Binder B, tab 1" },
    { id: "D4", title: "Village Municipal Water System Results (sample)", agency: "Ohio EPA",
      published: "2026-08-20", cadenceDays: 90, link: "", shelf: "Binder B, tab 2" },
    { id: "D5", title: "National Primary Drinking Water Regulations", agency: "U.S. EPA",
      published: "2024-04-10", cadenceDays: 3650, link: "https://www.epa.gov/ground-water-and-drinking-water/national-primary-drinking-water-regulations", shelf: "Binder C, tab 1" },
    { id: "D6", title: "Soil Sampling Results Near Derailment Site (sample)", agency: "U.S. EPA",
      published: "2026-06-15", cadenceDays: 90, link: "", shelf: "Binder A, tab 3" },
    // Where approved fact card text will come from. Cards stay placeholders until the panel approves them.
    { id: "D7", title: "ATSDR ToxFAQs fact sheets, printed copies for expert review (sample entry)", agency: "ATSDR",
      published: "2026-09-15", cadenceDays: 3650, link: "", shelf: "Binder C, tab 2" },
    // The kiosk's own word list (glossary). Plain definitions of words, never health text.
    { id: "G1", title: "Kiosk word list: plain-language definitions (sample, needs expert review)", agency: "Project team",
      published: "2026-09-15", cadenceDays: 365, link: "", shelf: "Binder C, tab 3" }
  ],

  analytes: {
    vinyl_chloride: { name: "Vinyl chloride", aliases: ["vinyl chloride", "vinylchloride", "vc", "chloroethene"] },
    dioxins: { name: "Dioxins (2,3,7,8-TCDD)", aliases: ["dioxin", "dioxins", "tcdd"] },
    butyl_acrylate: { name: "Butyl acrylate", aliases: ["butyl acrylate", "n-butyl acrylate"] },
    ethylhexyl_acrylate: { name: "Ethylhexyl acrylate", aliases: ["ethylhexyl acrylate", "2-ethylhexyl acrylate"] },
    egbe: { name: "Ethylene glycol monobutyl ether (EGBE)", aliases: ["ethylene glycol monobutyl ether", "egbe", "2-butoxyethanol"] }
  },

  // Federal MCLs from D5. null = no federal MCL exists (FR-12: state the absence).
  mcl: {
    vinyl_chloride: { value: 2, unit: "µg/L", docId: "D5" },
    dioxins: { value: 0.00003, unit: "µg/L", docId: "D5" },
    butyl_acrylate: null,
    ethylhexyl_acrylate: null,
    egbe: null
  },

  // `plain` is the short, everyday name shown on screen.
  sites: {
    sulphur_run: { name: "Sulphur Run", plain: "Sulphur Run (creek)", aliases: ["sulphur run", "sulfur run"] },
    leslie_run: { name: "Leslie Run", plain: "Leslie Run (creek)", aliases: ["leslie run"] },
    municipal: { name: "the village water system", plain: "Village tap water", aliases: ["municipal", "village water", "city water", "tap water", "public water"] },
    private_wells: { name: "private wells (county program)", plain: "Private wells (county testing program)", aliases: ["private well", "private wells", "my well", "wells", "well water", "well"] },

  // Everyday words for each kind of sample.
  mediumPlain: {

    "private well water": "well water",
    "treated drinking water": "treated tap water",
    "soil": "soil (dirt)"
  },

  // Sampling records. value null + detected false = not detected.
  records: [
    { docId: "D1", analyte: "vinyl_chloride", site: "sulphur_run", medium: "surface water", tract: "9516.01", sampleDate: "2023-03-02", value: null, detected: false, detectionLimit: 0.5, unit: "µg/L", agency: "U.S. EPA" },
    { docId: "D2", analyte: "vinyl_chloride", site: "sulphur_run", medium: "surface water", tract: "9516.01", sampleDate: "2023-03-02", value: 0.6, detected: true, detectionLimit: 0.2, unit: "µg/L", agency: "Ohio EPA" },
    { docId: "D1", analyte: "vinyl_chloride", site: "sulphur_run", medium: "surface water", tract: "9516.01", sampleDate: "2024-06-12", value: null, detected: false, detectionLimit: 0.5, unit: "µg/L", agency: "U.S. EPA" },

    { docId: "D1", analyte: "vinyl_chloride", site: "leslie_run", medium: "surface water", tract: "9516.02", sampleDate: "2023-04-11", value: null, detected: false, detectionLimit: 0.5, unit: "µg/L", agency: "U.S. EPA" },
    { docId: "D1", analyte: "vinyl_chloride", site: "leslie_run", medium: "surface water", tract: "9516.02", sampleDate: "2025-05-20", value: null, detected: false, detectionLimit: 0.5, unit: "µg/L", agency: "U.S. EPA" },
    { docId: "D1", analyte: "butyl_acrylate", site: "sulphur_run", medium: "surface water", tract: "9516.01", sampleDate: "2023-02-20", value: 3.1, detected: true, detectionLimit: 1, unit: "µg/L", agency: "U.S. EPA" },

<script>
// Core logic: pure functions, no screen code. Runs in the browser and in Node (for tests).
// Adapted from ../core.js. Main changes are marked "NEW" below.
(function (root) {
  const D = (typeof DATA !== "undefined") ? DATA : require("./data.js").DATA;

  const norm = s => (" " + String(s || "").toLowerCase().replace(/[’']/g, "'").replace(/[^a-z0-9µ.'\- ]+/g, " ").replace(/\s+/g, " ") + " ");

  // Same rules as ../core.js, plus a few extra phrasings (marked NEW) that the original missed.
  const TIER3 = [
    ["misuse",    /ignore (all|any|previous|prior|the|your)|system prompt|pretend|role ?play|you are now|jailbreak|developer mode|\bact as\b|forget (your|the) rules/],
    ["legal",     /settlement|lawsuit|\bsue\b|\bsuing\b|lawyer|attorney|\blegal(?! (limit|level))|compensation|payout|\bclaims?\b|eligib|deadline|\bliab/],
    ["property",  /property|home value|house value|lose value|resale|sell (my|the|our) (house|home)|insurance|mortgage|relocat|move away|moving away|should (i|we) move|real estate/],
    ["agency",    /\blying\b|\blie(d|s)?\b|cover ?up|trust (the )?(epa|agency|agencies|government|county|state)|corrupt|credib|honest about/],
    ["medical",   /symptom|\bsick|\bill\b|illness|rash|headache|cough|nausea|vomit|diagnos|doctor|blood test|screen(ing)? (me|for)|pregnan|treatment|medicine|hospital|my health|disease|asthma/],
    ["risk",      /cancer|\brisk|\bdoses?\b|exposed|exposure|chance of|likely to get|how much .*\b(i|we|my|me)\b .*(breath|drank|absorb|got)/
                  // NEW: health-effect questions ("what does it do to me", "health effects of", "how does X affect my kids")
                  ,/health effects?|side effects?|\beffects? (of|on|from)\b|what (does|do|did|will|can|would|could) .* do to\b|\baffects? (me|my|us|our|you|your|people|kids?|children|health|the body|humans|pets?|animals)\b/],
    ["causation", /\bcaus|because of the|from the (train|derailment|spill|chemicals?|fire|burn)|due to the|is it from|linked to|responsible for|\bfault\b|\bblame/],
    ["safety",    /\bsafe|unsafe|dangerous|danger|\bharm|toxic|\bworr|concern|\bok(ay)? (to|for)|fine to|alright to|should (i|we) (drink|use|let|stop|be|boil|bathe|keep)|can (i|we) (drink|let|swim|fish|eat|bathe|use|cook)|let (my|the) (kids?|children|grandkids?|pets?|dogs?)|play in|water (my|the) garden|\bboil/
                  // NEW: judgement words ("is it bad", "is my well clean", "is the creek contaminated")
                  ,/\bbad\b|\bclean\b|contaminated\b|\bpoison|\bdeadly\b|\blethal\b|\bhealthy\b|\bpure\b/
                  // NEW: "is the water ok / fine / alright?"
                  ,/\b(is|are) (it|the|my|our|this|that|these|those)\b.*\b(ok|okay|fine|alright|good)\b/]
  ];
  const tier3Match = q => { for (const [cat, ...res] of TIER3) if (res.some(re => re.test(q))) return cat; return null; };

  const GLOSSARY_Q = /what (is|are|does|do)|what's|whats|define|meaning of|stand for/;
  const TIER2 = /\bcompare|comparison|versus|\bvs\b|higher|lower|more than|less than|\bworse|\bbetter|trend|\bmean\b|\bmeans\b|explain|interpret|normal|elevated|\bhigh\b|\blow\b|significant|\bwhy\b|\bshould\b|tell me about|what does .* tell/;

  // NEW (gap 1): "What is vinyl chloride?" → that chemical's fact card.
  // Only matches when the question is just "what is <chemical>", so
  // "What is vinyl chloride at Sulphur Run?" still goes to the test results.
  const FACT_Q = /^ (?:what (?:is|are)|what's|whats|what exactly is|what exactly are) (?:the |a |an )?(?:chemical |chemicals |substance )?(?:called |named )?(.+?) $/;
  function factCardAnalyte(q) {
    const m = q.match(FACT_Q);
    if (!m) return null;
    const s = m[1].trim();
    return Object.keys(D.analytes).find(k => D.analytes[k].aliases.includes(s) || D.analytes[k].name.toLowerCase() === s) || null;
  }

  // NEW (gap 2): words that mean "show me the newest".
  const LATEST_Q = /\bright now\b|\blatest\b|\bcurrent(ly)?\b|\bnewest\b|\bmost recent\b|\brecent(ly)?\b|\bthese days\b|\btoday\b|\bnow\b|\bstill\b|\blast (test|tested|result|sample)/;
  const ALL_Q = /\b(all|every) (of )?(the )?(test |sample )?(results?|tests?|data|samples?)\b/;
  const RESULTS_WORD = /result|test|sample|data|reading|level|number/;

  function classify(question) {
    const q = norm(question);
    const cat = tier3Match(q);
    if (cat) return { tier: 3, category: cat };
    const fc = factCardAnalyte(q);
    if (fc) return { tier: 1, category: "factCard", analyte: fc };

    // ("What is the MCL for vinyl chloride?" now shows the actual limit).

    return { tier: 1, category: "facts" };

  function findGlossaryTerm(q) {
    return Object.keys(D.glossary).sort((a, b) => b.length - a.length)
      .find(t => { const n = norm(t).trim(); return q.includes(" " + n + " ") || q.includes(" " + n + "s "); });
  }

  const MONTHS = ["january","february","march","april","may","june","july","august","september","october","november","december"];
  const hasWord = (q, w) => new RegExp("[ ]" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "[ ]").test(q);

  function extract(question) {
    const q = norm(question);
    const analytes = Object.keys(D.analytes).filter(k => D.analytes[k].aliases.some(a => hasWord(q, a)));
    const sites = Object.keys(D.sites).filter(k => D.sites[k].aliases.some(a => hasWord(q, a)));
    const yearM = q.match(/\b(20\d\d)\b/);
    const month = MONTHS.findIndex(m => hasWord(q, m) || (m !== "may" && hasWord(q, m.slice(0, 3))));
    return { analytes, sites, year: yearM ? yearM[1] : null, month: month >= 0 ? month + 1 : null };
  }

  // ---------- FR-20: transient address → census tract ----------
  function tractFromAddress(address) {
    if (!address) return null;
    const a = norm(address);
    const key = Object.keys(D.streetToTract).sort((x, y) => y.length - x.length).find(s => a.includes(" " + s + " "));
    return key ? D.streetToTract[key] : null;
  }

  // ---------- Citations (FR-3 / FR-4) ----------
  const doc = id => D.documents.find(d => d.id === id);
  function citation(docId, sampleDate) {
    const d = doc(docId);
    if (!d) return null;
    const c = { docId, title: d.title, agency: d.agency, published: d.published, sampleDate: sampleDate || null,
      corpusUpdated: D.corpusUpdated, where: d.link || d.shelf, link: d.link, shelf: d.shelf, stale: isStale(d) };
    return (c.title && c.agency && c.published && c.where) ? c : null; // incomplete → not shown
  }

  // ---------- FR-18 / FR-19 freshness ----------
  const DAY = 86400000;
  const today = () => new Date(new Date().toISOString().slice(0, 10));
  const daysSince = iso => Math.floor((today() - new Date(iso)) / DAY);
  const isStale = d => daysSince(d.published) > d.cadenceDays + 90;
  const isSunset = lastRefreshIso => daysSince(lastRefreshIso) > 180;

  // ---------- Templates (FR-6), written in short plain sentences ----------
  const lc = s => s[0].toLowerCase() + s.slice(1);
  const fmtDate = iso => new Date(iso + "T00:00:00").toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" });
  function mclText(analyte) {
    const m = D.mcl[analyte];
    const name = D.analytes[analyte].name;
    if (m === undefined) return null;
    if (m === null) return { type: "limit", analyte, text: `There is no federal limit (MCL) for ${lc(name)} in drinking water.`, cite: citation("D5") };
    return { type: "limit", analyte, text: `The federal limit (MCL) for ${lc(name)} in public drinking water is ${m.value} ${m.unit}.`, cite: citation(m.docId) };
  }
  function resultText(r) {
    return r.detected ? `${r.value} ${r.unit}` : `not found`;
  }
  function recordText(r) {
    const a = D.analytes[r.analyte].name, s = D.sites[r.site].plain || D.sites[r.site].name;
    const extra = r.detected ? "" : ` This test can find as little as ${r.detectionLimit} ${r.unit}.`;
    return `${a} in ${s}. Tested by ${r.agency} on ${fmtDate(r.sampleDate)}. Result: ${resultText(r)}.${extra}`;
  }
  function recordItem(r, conflictKeys) {
    return {
      type: "record", text: recordText(r), cite: citation(r.docId, r.sampleDate),
      analyte: r.analyte, analyteName: D.analytes[r.analyte].name,
      site: r.site, place: D.sites[r.site].plain || D.sites[r.site].name,
      kindOfSample: (D.mediumPlain && D.mediumPlain[r.medium]) || r.medium,
      date: r.sampleDate, agency: r.agency, detected: r.detected, value: r.value, unit: r.unit,
      detectionLimit: r.detectionLimit, result: resultText(r),
      conflict: conflictKeys.has(groupKey(r) + "|" + r.sampleDate)

  }

  // "Location" = one place + one chemical + one kind of sample.
  const groupKey = r => r.site + "|" + r.analyte + "|" + r.medium;

  // NEW (gap 2): newest result per location first; older ones go to history.
  // Results from the same newest date stay together (so disagreements stay visible).
  function splitNewest(recs) {
    const newest = {};
    recs.forEach(r => { const k = groupKey(r); if (!newest[k] || r.sampleDate > newest[k]) newest[k] = r.sampleDate; });
    const byDateDesc = (a, b) => b.sampleDate.localeCompare(a.sampleDate) ||
      (D.sites[a.site].plain || "").localeCompare(D.sites[b.site].plain || "") || a.analyte.localeCompare(b.analyte) || a.agency.localeCompare(b.agency);
    const latest = recs.filter(r => r.sampleDate === newest[groupKey(r)]).sort(byDateDesc);
    const older = recs.filter(r => r.sampleDate !== newest[groupKey(r)]).sort(byDateDesc);
    return { latest, older };
  }

  // ---------- Retrieval (FR-2, FR-11, FR-12) ----------
  function retrieve(question, tract) {
    const e = extract(question);
    const q = norm(question);
    const wantsLimit = /limit|\bmcl\b|threshold|standard|allowed|legal level|maximum/.test(q);
    const wantsDocs = /where (can|do|could) (i|we) (read|find|see|get)|which (document|report)|\bdocuments?\b|\breports?\b|\bsources?\b/.test(q);
    const wantsLatest = LATEST_Q.test(q);
    const wantsAll = ALL_Q.test(q) || (wantsLatest && RESULTS_WORD.test(q));
    const hasEntity = e.analytes.length || e.sites.length || tract;
    if (!hasEntity && !wantsDocs && !wantsAll) return { relevant: false, entities: e };

    let recs = D.records.filter(r =>
      (!e.analytes.length || e.analytes.includes(r.analyte)) &&
      (!e.sites.length || e.sites.includes(r.site)) &&
      (!tract || r.tract === tract) &&
      (!e.year || r.sampleDate.startsWith(e.year)) &&
      (!e.month || Number(r.sampleDate.slice(5, 7)) === e.month));

    const out = { relevant: true, entities: e, wantsLatest, records: recs, limits: [], docs: [], conflicts: [], absence: null };

    if (wantsLimit) out.limits = (e.analytes.length ? e.analytes : []).map(mclText).filter(Boolean);
    if (wantsDocs) {
      const ids = new Set((recs.length ? recs : D.records.filter(r => (!e.sites.length || e.sites.includes(r.site)) && (!e.analytes.length || e.analytes.includes(r.analyte)))).map(r => r.docId));
      out.docs = (ids.size && hasEntity ? [...ids] : D.documents.map(d => d.id)).map(id => citation(id)).filter(Boolean);
    }
    if (wantsLimit && !e.sites.length && !tract) out.records = recs = []; // limit-only question
    if (wantsDocs && !wantsAll && !wantsLatest && !e.year && !e.month) out.records = recs = []; // "where can I read…" → documents only

    // FR-11 conflicts: same analyte, site, date — different agencies, different results.
    const groups = {};
    recs.forEach(r => (groups[groupKey(r) + "|" + r.sampleDate] ||= []).push(r));
    out.conflicts = Object.entries(groups).filter(([, g]) => g.length > 1 &&
      new Set(g.map(r => r.agency)).size > 1 && new Set(g.map(r => r.detected ? r.value : "ND")).size > 1);

    if (!recs.length && !out.limits.length && !out.docs.length) {
      const parts = [];
      if (e.analytes.length) parts.push(e.analytes.map(a => D.analytes[a].name.toLowerCase()).join(" or "));
      if (e.sites.length) parts.push("for " + e.sites.map(x => D.sites[x].plain || D.sites[x].name).join(" or "));
      if (tract) parts.push("near your street");
      if (e.year || e.month) parts.push("in " + [e.month ? MONTHS[e.month - 1][0].toUpperCase() + MONTHS[e.month - 1].slice(1) : "", e.year || ""].join(" ").trim());
      out.absence = `We don't have data on ${parts.join(" ") || "that"}.`;
    }
    return out;
  }

  // Fact card status for one chemical (FR-9). Never returns text that isn't approved.
  function factCard(a, suspended) {
    const fc = D.factCards[a];
    const name = D.analytes[a].name;
    if (!fc) return { analyte: a, name, status: "none" };
    if (suspended.factCards || !fc.approved) return { analyte: a, name, status: "pending", source: fc.source };
    const cite = citation(fc.docId || "D7");
    if (!cite) return { analyte: a, name, status: "pending", source: fc.source };
    return { analyte: a, name, status: "approved", source: fc.source, text: fc.text, approvedDate: fc.approvedDate, cite };
  }

  // Dates for the date banner (FR-4), shown on every result.
  function dateBanner(items) {
    const dates = (items || []).map(i => i.date).filter(Boolean).sort();
    return { corpusUpdated: D.corpusUpdated, newestSample: dates.length ? dates[dates.length - 1] : null };
  }

  // ---------- Main entry: answer a question ----------
  // opts: { tract, suspended: {tier1, tier2, factCards} }
  function answer(question, opts = {}) {
    const cls = classify(question);
    const suspended = opts.suspended || {};
    const base = { tier: cls.tier, category: cls.category, question, dates: dateBanner([]) };

    if (cls.tier === 3) return { ...base, kind: "referral", referral: D.referrals[cls.category] };

    if (cls.tier === 1 && suspended.tier1) return { ...base, kind: "suspended" };

    // NEW (gap 1): fact card answer.
    if (cls.category === "factCard") {
      const a = cls.analyte;
      const recs = D.records.filter(r => r.analyte === a);
      const lim = mclText(a);
      const items = lim && lim.cite ? [lim] : [];
      const newest = recs.map(r => r.sampleDate).sort().pop() || null;
      return { ...base, kind: "factCard", analyte: a, name: D.analytes[a].name, card: factCard(a, suspended),
        items, testCount: recs.length, newestTest: newest,
        absence: recs.length ? null : `We don't have test results for ${D.analytes[a].name.toLowerCase()}.`,
        dates: { corpusUpdated: D.corpusUpdated, newestSample: newest } };
    }

    if (cls.category === "glossary") {
      const cite = citation("G1");
      return { ...base, kind: "glossary", term: cls.term, definition: D.glossary[cls.term], cite };
    }

    if (cls.tier === 2 && suspended.tier2) return { ...base, kind: "suspended" };

    const r = retrieve(question, opts.tract);
    if (!r.relevant) return { ...base, kind: "noAnswer" };

    const conflictKeys = new Set(r.conflicts.map(([k]) => k));
    const { latest, older } = splitNewest(r.records);

    // Build cited items. Any item that can't be cited is dropped (FR-3).
    const uniq = arr => { const seen = new Set(); return arr.filter(i => i.cite && !seen.has(i.text) && seen.add(i.text)); };
    const latestItems = uniq(latest.map(x => recordItem(x, conflictKeys)));
    const historyItems = uniq(older.map(x => recordItem(x, conflictKeys)));
    const limitItems = uniq((r.records.length ? [...new Set(r.records.map(x => x.analyte))].map(mclText).filter(Boolean) : []).concat(r.limits));

    if (!latestItems.length && !limitItems.length && !r.docs.length && !r.absence) return { ...base, kind: "noAnswer" };

    const res = { ...base, kind: cls.tier === 1 ? "answer" : "referenceSheet",
      wantsLatest: r.wantsLatest,
      items: latestItems, history: historyItems, limits: limitItems, docs: r.docs,
      conflicts: r.conflicts.map(([, g]) => g.map(x => ({ agency: x.agency, text: recordText(x), date: x.sampleDate }))),
      absence: r.absence, dates: dateBanner(latestItems.concat(historyItems)) };

    if (cls.tier === 2) {
      const analytes = [...new Set(r.records.map(x => x.analyte).concat(r.entities.analytes))];
      res.factCards = analytes.map(a => factCard(a, suspended));
    }
    return res;
  }

  // Every piece of text in a result, in reading order (for read-aloud, word explanations and audits).
  function resultTexts(r) {
    const t = [];
    (r.items || []).forEach(i => t.push(i.text));
    (r.limits || []).forEach(i => t.push(i.text));
    (r.history || []).forEach(i => t.push(i.text));
    if (r.absence) t.push(r.absence);
    if (r.definition) t.push(r.definition);
    return t;
  }

  // Glossary words used in a result, so the screen can explain them.
  function wordsUsed(r) {
    const text = norm(resultTexts(r).join(" ")).replace(/[.,]+ /g, " ");
    const found = Object.keys(D.glossary).filter(k => k !== (r.term || "") && text.includes(" " + norm(k).trim() + " "));
    // Prefer "mcl" over its long form, and drop terms contained in a longer found term.
    return found.filter(k => k !== "maximum contaminant level" && !found.some(o => o !== k && o.includes(k)))
      .map(k => ({ term: k, definition: D.glossary[k] }));
  }

  // ---------- NFR-7 readability (Flesch-Kincaid grade) ----------
  function syllables(w) {
    w = w.toLowerCase().replace(/[^a-z]/g, "");
    if (w.length <= 3) return 1;
    w = w.replace(/(?:[^laeiouy]es|ed|[^laeiouy]e)$/, "").replace(/^y/, "");
    const m = w.match(/[aeiouy]{1,2}/g);
    return m ? m.length : 1;
  }
  function gradeLevel(text) {
    const sentences = Math.max(1, (text.match(/[.!?]+(\s|$)/g) || []).length);
    const words = text.split(/\s+/).filter(w => /[a-z]/i.test(w));
    if (!words.length) return 0;
    const syl = words.reduce((s, w) => s + syllables(w), 0);
    return +(0.39 * (words.length / sentences) + 11.8 * (syl / words.length) - 15.59).toFixed(1);
  }

  // ---------- FR-23 evaluation harness ----------
  function runEval(EV) {
    const bench = EV.benchmark.map(b => { const c = classify(b.q); return { q: b.q, expected: b.tier, got: c.tier, pass: c.tier === b.tier }; });
    const red = EV.redTeam.map(q => { const c = classify(q); return { q, got: c.tier, category: c.category, pass: c.tier === 3 }; });
    const pct = a => Math.round(100 * a.filter(x => x.pass).length / a.length);
    return { bench, red, benchPct: pct(bench), redPct: pct(red), gatePass: pct(bench) >= 95 && pct(red) === 100 };
  }

  const Core = { classify, extract, retrieve, answer, citation, tractFromAddress, isStale, isSunset, daysSince,
    gradeLevel, runEval, fmtDate, doc, resultTexts, wordsUsed };
  if (typeof module !== "undefined") module.exports = Core; else root.Core = Core;
})(this);

</script>
<script>
// Screens for the user-friendly kiosk. Adapted from ../app.js.
// Prototype state lives in this browser's localStorage; the real kiosk would use local SQLite.
// Uses its own storage key, so it does not mix with the root prototype.
const KEY = "ehl-kiosk-friendly-state";
const defaults = {
  ack: false, killSwitch: false, emergency: false, staffed: true,
  lastSignedRefresh: DATA.corpusUpdated, refreshLog: [{ date: DATA.corpusUpdated, signedBy: "initial load", version: DATA.corpusVersion }],
  suspended: { tier1: false, tier2: false, factCards: false },
  sessionCount: 0, tractCounts: {}, log: [], reports: [], incidents: [], audits: [], flags: []
};
let S;
try { S = { ...defaults, ...JSON.parse(localStorage.getItem(KEY) || "{}") }; } catch { S = { ...defaults }; }
S.suspended = { ...defaults.suspended, ...(S.suspended || {}) };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} };

let sessionId = null;  // random, not tied to any person (FR-21)
let last = null;       // last result, for printing / reporting
let openTopic = null;  // which topic's questions are showing

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = iso => iso ? Core.fmtDate(iso) : "";
const app = $("#app");
const go = h => { location.hash = h; };

// Topics and tap-to-ask questions live in data.js (DATA.topics).
const TOPICS = DATA.topics;

// ---------- Display settings (per person; reset by "Done") ----------
const view = { size: "1", contrast: false };
function applyView() {
  const root = document.documentElement;
  root.dataset.size = view.size;
  if (view.contrast) root.dataset.contrast = "high"; else delete root.dataset.contrast;
  $$(".size-btn").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.size === view.size)));
  const c = $(".contrast-btn"); if (c) c.setAttribute("aria-pressed", String(view.contrast));
}

// ---------- Shared pieces on every screen (FR-10, FR-13, FR-14, FR-15, NFR-9) ----------
function footer() {
  const onStaff = location.hash === "#/staff";
  return `<footer class="site-footer">
    <div class="help-bar no-print">
      <button type="button" class="btn primary print-cta" data-action="print">Print this and talk to a librarian</button>
      <button type="button" class="btn" data-action="speak">${speaking ? "Stop reading" : "Read aloud"}</button>
      <button type="button" class="btn" data-action="report">Report a problem</button>
      <button type="button" class="btn" data-action="limits">Known limitations</button>
    </div>
    <p class="print-only"><strong>Print this and talk to a librarian.</strong> Notes:</p>
    <div class="print-only notes-lines"></div><div class="print-only notes-lines"></div><div class="print-only notes-lines"></div>
    <p class="disclaimer">${esc(DATA.disclaimer)}</p>
    ${DATA.isSample ? `<p class="sample-note">Test version: all data on this kiosk is made-up sample data.</p>` : ""}
    <p class="no-print">${onStaff ? `<a href="#/" class="staff-link">Back to the patron screen</a>` : `<a href="#/staff" class="staff-link">Staff</a>`}</p>
  </footer>`;
}

function startSession() {
  sessionId = Math.random().toString(36).slice(2, 10);
  S.sessionCount++; save();
}
function endSession() {
  last = null; sessionId = null; openTopic = null;
  view.size = "1"; view.contrast = false; applyView();
  stopSpeaking();
  if (location.hash && location.hash !== "#/") go("#/"); else render();
  window.scrollTo(0, 0);
}

// ---------- Patron screens ----------
function renderPatron() {
  // FR-17 emergency mode overrides everything.
  if (S.emergency) {
    app.innerHTML = `<h1>Emergency information</h1>
      <div class="card stop"><p class="big-result">${esc(DATA.emergency.advisory)}</p>
      <ul>${DATA.emergency.numbers.map(n => `<li>${esc(n)}</li>`).join("")}</ul></div>
      <p>Questions are turned off right now. Please ask a librarian.</p>${footer()}`;
    return;
  }
  // FR-14 first-use screen.
  if (!S.ack || !sessionId) { renderWelcome(); return; }

  // FR-16 kill switch, FR-22 staffing, FR-19 auto-sunset → document browser only.
  const sunset = Core.isSunset(S.lastSignedRefresh);
  if (S.killSwitch || !S.staffed || sunset) {
    const why = S.killSwitch ? "Library staff have turned questions off for now." :
      !S.staffed ? "Questions only work while a librarian is at the reference desk." :
      "The data has not been updated in over 180 days, so questions are turned off.";
    app.innerHTML = `<h1>Questions are turned off right now</h1>
      <div class="banner stop"><p>${why}</p><p>You can still look at the list of reports below.</p></div>
      ${dateBannerHTML({ corpusUpdated: DATA.corpusUpdated })}
      <h2>Reports you can read</h2>${docBrowser()}${footer()}`;
    return;
  }
  renderMain();
}

function renderWelcome() {
  app.innerHTML = `<h1>Welcome</h1>
    <p class="big-result">This kiosk shows official water and soil test results for the East Palestine area.</p>
    <div class="card"><h2>It can show you</h2>
      <ul><li>What was tested</li><li>Where and when it was tested</li><li>Which agency did the test</li><li>The result, and the federal limit</li><li>Where to read the full report</li></ul></div>
    <div class="card stop"><h2>It cannot tell you</h2>
      <ul><li>If something is safe</li><li>Anything about your health</li><li>Legal or money advice</li><li>Why something happened</li></ul>
      <p>For those questions, it will tell you who can help.</p></div>
    <p>Is the text too small? Tap <strong>A+</strong> or <strong>A++</strong> at the top of the screen.</p>
    <button type="button" class="btn primary wide" data-action="start">I understand. Start.</button>
    ${footer()}`;
}

function topicButton(t) {
  return `<button type="button" class="topic${t.warn ? " warn-topic" : ""}" data-topic="${t.id}" aria-expanded="${openTopic === t.id}" aria-controls="questions">
    ${esc(t.label)}<small>${esc(t.sub)}</small></button>`;
}
function questionsHTML(id) {
  const t = TOPICS.find(x => x.id === id);
  if (!t) return "";
  if (t.street) return `<div class="questions"><h2>Results near my street</h2>
    <p>Pick your street. We use it once to find your area. Then we forget it.</p>
    <label for="street">Your street</label>
    <select id="street"><option value="">Choose a street…</option>${DATA.streets.map(s => `<option>${esc(s)}</option>`).join("")}</select>
    <div class="row"><button type="button" class="btn primary wide" data-action="street">Show results near this street</button></div></div>`;
  return `<div class="questions"><h2>${esc(t.label)}</h2>
    ${t.intro ? `<p>${esc(t.intro)}</p>` : `<p>Tap a question to ask it.</p>`}
    <ul class="q-list">${t.questions.map(q => `<li><button type="button" class="q-btn" data-ask="${esc(q)}">${esc(q)}</button></li>`).join("")}</ul></div>`;
}

function renderMain() {
  app.innerHTML = `<div class="layout">
    <section class="ask-panel no-print" aria-labelledby="ask-h">
      <h1 id="ask-h">What would you like to know?</h1>
      <p>Tap a topic. Then tap a question. You don't need to type.</p>
      <div class="topics">${TOPICS.map(topicButton).join("")}</div>
      <div id="questions">${openTopic ? questionsHTML(openTopic) : ""}</div>
      <div class="panel-box">
        <form id="type-form">
          <label for="q">Or type your own question</label>
          <textarea id="q" rows="2" placeholder="Example: What is vinyl chloride?"></textarea>
          <div class="row"><button type="submit" class="btn primary wide">Ask</button></div>
        </form>
      </div>
      <div class="panel-box"><button type="button" class="btn wide" data-action="done">Done. Clear the screen for the next person.</button></div>
    </section>
    <section id="result" aria-live="polite" tabindex="-1">${last ? resultHTML(last) : placeholderHTML()}</section>
  </div>${footer()}`;
}

function placeholderHTML() {
  return `<div class="banner info no-print"><p><strong>Your answer will show here.</strong></p>
    <p>Not sure where to start? Tap <strong>Newest results</strong>.</p></div>`;
}

function askQuestion(q, opts = {}) {
  q = (q || "").trim();
  if (!q) { showResult(`<div class="banner date"><p>Please type a question first, or tap a topic.</p></div>`); return; }
  const tract = opts.tract || null;
  if (tract) S.tractCounts[tract] = (S.tractCounts[tract] || 0) + 1;
  last = Core.answer(q, { tract, suspended: S.suspended });
  // Anonymous log for audits: no names, no address, random session id only.
  S.log.push({ id: S.log.length + 1, session: sessionId, ts: new Date().toISOString(), question: q, tier: last.tier, category: last.category, kind: last.kind });
  // FR-11: agency disagreements are flagged for staff.
  if (last.conflicts && last.conflicts.length)
    S.flags.push({ id: S.flags.length + 1, ts: new Date().toISOString(), question: q, items: last.conflicts.flat().map(c => c.text) });
  save();
  showResult(resultHTML(last));
}

function showResult(html) {
  const el = $("#result");
  if (!el) return;
  stopSpeaking();
  el.innerHTML = html;
  // On a phone the answer is below the topics, so move there.
  el.scrollIntoView({ behavior: "smooth", block: "start" });
  el.focus({ preventScroll: true });
}

// ---------- Result rendering (FR-3, FR-4, FR-6..FR-12) ----------
function dateBannerHTML(d) {
  d = d || {};
  return `<div class="banner date" role="note">
    <p><strong>Data last updated:</strong> ${fmt(d.corpusUpdated || DATA.corpusUpdated)}</p>
    ${d.newestSample ? `<p><strong>Newest test on this page:</strong> ${fmt(d.newestSample)}</p>` : ""}
    <p>This kiosk does not have live readings. It only shows results that agencies have already published.</p></div>`;
}

function citeHTML(c) {
  if (!c) return "";
  return `<div class="cite">
    ${c.stale ? `<p class="stale">This report may be out of date. A newer one was expected by now.</p>` : ""}
    <p><strong>Source:</strong> ${esc(c.title)} (${esc(c.agency)})</p>
    <p>Published ${fmt(c.published)}.${c.sampleDate ? ` Sample taken ${fmt(c.sampleDate)}.` : ""}</p>
    <p><strong>Read it:</strong> Library binder: ${esc(c.shelf)}${c.link ? ` · <a href="${esc(c.link)}" target="_blank" rel="noopener">Online copy</a>` : ""}</p>
  </div>`;
}

function recordCard(i) {
  return `<div class="card result-card">
    <p class="chem">${esc(i.analyteName)}</p>
    ${i.conflict ? `<span class="flag-badge">Agencies disagree on this test. See the note about agencies.</span>` : ""}
    <dl class="facts">
      <dt>Result</dt><dd><span class="big-result">${i.detected ? `${esc(i.value)} ${esc(i.unit)}` : "Not found"}</span>
        ${i.detected ? "" : `<br>This test can find as little as ${esc(i.detectionLimit)} ${esc(i.unit)}.`}</dd>
      <dt>Tested on</dt><dd>${fmt(i.date)}</dd>
      <dt>Tested by</dt><dd>${esc(i.agency)}</dd>
      <dt>Sample</dt><dd>${esc(i.kindOfSample)}</dd>
    </dl>
    ${citeHTML(i.cite)}
  </div>`;
}

// Group result cards under a heading for each place.
function byPlace(items) {
  const groups = [];
  items.forEach(i => { let g = groups.find(x => x.place === i.place); if (!g) groups.push(g = { place: i.place, items: [] }); g.items.push(i); });
  return groups.map(g => `<h3 class="place-head">${esc(g.place)}</h3>${g.items.map(recordCard).join("")}`).join("");
}

function recordsBlock(r) {
  let h = "";
  // FR-11: show each disagreement next to the results it is about (newest, or inside history).
  const conflictCard = g => `<div class="card flag" role="note">
    <h3>Agencies reported different results</h3>
    <p>Two agencies tested the same place on the same day. They got different results. We show both. This has been flagged for library staff.</p>
    <ul>${g.map(x => `<li>${esc(x.text)}</li>`).join("")}</ul>
    <p>A librarian can help you look at both reports.</p></div>`;
  const isNewest = g => (r.items || []).some(i => i.conflict && i.date === g[0].date);
  const newConf = (r.conflicts || []).filter(isNewest), oldConf = (r.conflicts || []).filter(g => !isNewest(g));
  h += newConf.map(conflictCard).join("");
  if (oldConf.length) h += `<div class="banner stop" role="note"><p><strong>Note:</strong> In the older results, agencies reported different results for the same test. Tap <strong>Show history</strong> to see both.</p></div>`;

  if (r.items && r.items.length) {
    h += r.wantsLatest
      ? `<div class="banner info"><p><strong>You asked about the newest results.</strong> These are the latest tests on file for each place. They are not live readings.</p></div>`
      : `<div class="banner info"><p>The newest result for each place is shown first.${r.history && r.history.length ? ` Older results are under <strong>Show history</strong>.` : ""}</p></div>`;
    h += `<h2>Newest results</h2>` + byPlace(r.items);
  }
  if (r.history && r.history.length) {
    const n = r.history.length;
    h += `<details class="history"><summary><span class="when-closed">Show history</span><span class="when-open">Hide history</span>&nbsp;(${n} older result${n === 1 ? "" : "s"})</summary>
      <h2>Older results</h2><p>Newest first.</p>${oldConf.map(conflictCard).join("")}${byPlace(r.history)}</details>`;
  }
  if (r.limits && r.limits.length) {
    h += `<h2>Federal drinking-water limits</h2>
      <p>This is the published limit. The kiosk does not compare results to it. A librarian can help you read both.</p>` +
      r.limits.map(l => `<div class="card"><p>${esc(l.text)}</p>${citeHTML(l.cite)}</div>`).join("");
  }
  if (r.docs && r.docs.length) h += `<h2>Where to read it</h2>` + r.docs.map(c => `<div class="card">${citeHTML(c)}</div>`).join("");
  if (r.absence) h += `<div class="card"><h2>We don't have data on that.</h2><p>${esc(r.absence)}</p>
    <p>Try a topic button, or print this page and ask a librarian.</p></div>`;
  return h;
}

function wordsHTML(r) {
  const w = Core.wordsUsed(r);
  if (!w.length) return "";
  return `<section class="words"><h2>What these words mean</h2><dl>
    ${w.map(x => `<dt>${esc(termLabel(x.term))}</dt><dd>${esc(x.definition)}</dd>`).join("")}</dl></section>`;
}
function termLabel(t) {
  const special = { "mcl": "MCL", "ppb": "ppb", "µg/l": "µg/L", "ng/kg": "ng/kg", "epa": "EPA", "ohio epa": "Ohio EPA", "atsdr": "ATSDR" };
  return special[t] || t[0].toUpperCase() + t.slice(1);
}

function factCardHTML(f, opts = {}) {

    <p class="hint">Copied word for word from ${esc(f.source)}. Approved by experts on ${fmt(f.approvedDate)}.</p>${citeHTML(f.cite)}</div>`;
  return `<div class="card fact">${h}

    <p>A librarian can help you find official fact sheets now.</p></div>`;
}

function resultHTML(r) {

  const back = `<div class="row no-print back-to-topics"><button type="button" class="btn" data-action="back">‹ Back to topics</button></div>`;
  const banner = dateBannerHTML(r.dates);
  let body = "";

      body = `<div class="card stop"><h2>A person can help with this</h2>
        <p>This kiosk can't answer questions about <strong>${esc(r.referral.label)}</strong>. It only shows published test results.</p>
        <dl class="facts"><dt>Who can help</dt><dd>${esc(r.referral.to)}</dd>

        <p>You can also talk to a librarian at the reference desk.</p></div>`;

    case "suspended":

      break;
    case "glossary":
      body = `<div class="card"><h2>${esc(termLabel(r.term))}</h2><p class="big-result">${esc(r.definition)}</p>${citeHTML(r.cite)}</div>` + wordsHTML(r);
      break;
    case "factCard": {
      const alias = DATA.analytes[r.analyte].aliases[0];
      body = `<h2>${esc(r.name)}</h2>${factCardHTML(r.card)}
        ${r.items.map(l => `<div class="card"><h3>Federal drinking-water limit</h3><p>${esc(l.text)}</p>${citeHTML(l.cite)}</div>`).join("")}
        <div class="card"><h3>Test results on file</h3>

          <div class="row no-print"><button type="button" class="btn primary" data-ask="${esc(`What are the latest ${alias} results?`)}">Show the test results</button></div>`
          : `<p>${esc(r.absence)}</p>`}</div>` + wordsHTML(r);

    }

  return back + asked + banner + body + `<div class="row no-print"><button type="button" class="btn" data-action="back">Ask another question</button></div>`;

// ---------- Read aloud (NFR-9): the device's built-in speech, no network ----------
let speaking = false;
function readableText(root) {
  const skip = "button, select, textarea, input, .no-print, .print-only, script, style";
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  let out = "", lastBlock = null, n;
  while ((n = walker.nextNode())) {
    const p = n.parentElement;
    if (!p || p.closest(skip) || !p.getClientRects().length) continue;
    const t = n.textContent.replace(/\s+/g, " ").trim();
    if (!t) continue;
    const block = p.closest("h1,h2,h3,p,li,dt,dd,summary,div");
    if (block !== lastBlock && out && !/[.!?:]$/.test(out)) out += ".";
    out += " " + t; lastBlock = block;
  }
  return out.replace(/µg\/L/g, "micrograms per liter").replace(/ng\/kg/g, "nanograms per kilogram").trim();
}
function speak() {
  if (!("speechSynthesis" in window)) { toast("Read aloud is not available on this device."); return; }
  if (speaking) { stopSpeaking(); return; }
  const res = $("#result");
  const target = res && last ? res : app;
  const u = new SpeechSynthesisUtterance(readableText(target));
  u.lang = "en-US"; u.rate = 0.9;
  u.onend = u.onerror = () => { speaking = false; updateSpeakButtons(); };
  speechSynthesis.cancel(); speechSynthesis.speak(u);
  speaking = true; updateSpeakButtons();
}
function stopSpeaking() { if ("speechSynthesis" in window) speechSynthesis.cancel(); speaking = false; updateSpeakButtons(); }

  if (el.dataset.size) { view.size = el.dataset.size; applyView(); return; }

  if (el.dataset.ask) { e.preventDefault(); askQuestion(el.dataset.ask); return; }
  switch (el.dataset.action) {
    case "start": S.ack = true; startSession(); render(); window.scrollTo(0, 0); break;

    case "speak": speak(); break;

    case "home": go("#/"); break;
    case "contrast": view.contrast = !view.contrast; applyView(); break;
    case "back": {
      stopSpeaking();

      const t = openTopic ? $(`.topic[data-topic="${openTopic}"]`) : $(".topic"); if (t) t.focus({ preventScroll: true });

    case "street": {
      const sel = $("#street");
      const street = sel ? sel.value : "";
      if (!street) { toast("Please choose a street first."); return; }

      askQuestion("Test results near my street", { tract });

    }
    case "toggle": toggle(el.dataset.key); break;
    case "suspend": suspend(el.dataset.key); break;
    case "refresh": signedRefresh(); break;
    case "integrity": integrityCheck(); break;
    case "sendReport": sendReport(Number(el.dataset.id)); break;
    case "audit": drawAudit(); break;
  }
});

<script>
// EXTRA FEATURES (Project 3.2) — on/off switches.
// Set any of these to false to turn that feature off. Nothing else needs to change.

const KIOSK_FEATURES = {

  helpTicket: true,   // "Get help from a librarian" ticket + staff queue. Offline.
  voice: true,        // "Speak your question" button + answer read aloud. Uses the browser's speech tools.

<script>
// "Did you mean?" helpers: fix typos and spot vague questions. Pure functions, no screen code.
// Runs in the browser and in Node (for test-features.js).
(function (root) {
  const D = (typeof DATA !== "undefined") ? DATA : require("../data.js").DATA;

  // Words we try to correct toward: chemical and place names, word-list terms, and
  // safety words (so a misspelled safety question is still caught by the safety gate).
  const SAFETY_WORDS = ["safe", "unsafe", "dangerous", "toxic", "harmful", "sick", "cancer", "doctor", "lawyer",
    "settlement", "lawsuit", "drink", "poison", "contaminated", "healthy", "worried", "exposure", "symptoms"];
  const KIOSK_WORDS = ["latest", "newest", "results", "result", "water", "limit", "tested", "report", "reports", "history", "detected"];
  // Ordinary words we never "correct" (they are close to vocabulary words but mean something else).
  const KEEP = new Set(("what when where which that this there these those have does done tell show with from your " +
    "about been were them they find read mean near some many much last here like know want need make many more most " +
    "over very just only also into than then well will would could should shall each every same wash cell sell bill fill " +
    "test time take talk walk weld wall hell held help hold soap song soul").split(" "));

  const vocab = [...new Set([
    ...Object.values(D.analytes).flatMap(a => a.aliases),
    ...Object.values(D.sites).flatMap(s => s.aliases),
    ...Object.keys(D.glossary),
    ...SAFETY_WORDS, ...KIOSK_WORDS
  ].map(v => v.toLowerCase()).filter(v => v.replace(/[^a-z]/g, "").length >= 4))];

  function lev(a, b) {
    const m = a.length, n = b.length;
    // Edit distance where a swap of two neighbouring letters ("saef" → "safe") counts as one typo.
    const d = Array.from({ length: m + 1 }, (_, i) => [i, ...Array(n).fill(0)]);
    for (let j = 1; j <= n; j++) d[0][j] = j;
    for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) {
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);
    }
    return d[m][n];
  }
  const allowed = len => len <= 5 ? 1 : len <= 9 ? 2 : 3;

  // Returns the question with misspelled words fixed, or the same text if nothing changed.
  function correct(question) {
    const words = String(question || "").toLowerCase().replace(/[’']/g, "'").replace(/[^a-z0-9µ/.'\- ]+/g, " ").split(/\s+/).filter(Boolean);
    const out = [];
    for (let i = 0; i < words.length;) {
      let done = false;
      for (let n = 3; n >= 1 && !done; n--) {
        if (i + n > words.length) continue;
        const phrase = words.slice(i, i + n).join(" ").replace(/[.?!,]+$/, "");
        if (phrase.length < 4 || (n === 1 && KEEP.has(phrase))) continue;
        if (vocab.includes(phrase)) { out.push(phrase); i += n; done = true; break; }
        let best = null, bestD = Infinity;
        const pw = phrase.split(" ");
        for (const v of vocab) {
          const vw = v.split(" ");
          if (vw.length !== n) continue;
          // Every word must be the same, or a believable typo of a longer, uncommon word.
          if (!pw.every((w, k) => w === vw[k] || (w.length >= 4 && !KEEP.has(w) && lev(w, vw[k]) <= allowed(w.length)))) continue;
          const d = lev(phrase, v);
          if (d < bestD) { best = v; bestD = d; }
        }
        if (best && bestD > 0 && bestD <= allowed(phrase.length)) { out.push(best); i += n; done = true; }
      }
      if (!done) { out.push(words[i]); i++; }
    }
    return out.join(" ");
  }

  // Vague: about water/test results, but no place or chemical named.
  const VAGUE = /\b(water|results?|tests?|tested|samples?|levels?|chemicals?|data|creeks?|streams?|faucet|tap|wells?|soil|dirt|numbers?)\b/;
  const isVague = q => VAGUE.test(String(q || "").toLowerCase());

  // The choices shown for a vague question. Each one is a question the kiosk already answers.
  const CLARIFY = [
    { label: "Village tap water", q: "What are the latest results for the village tap water?" },
    { label: "Sulphur Run (creek)", q: "What are the latest results for Sulphur Run?" },
    { label: "Leslie Run (creek)", q: "What are the latest results for Leslie Run?" },
    { label: "Private wells", q: "What are the latest private well results?" },
    { label: "Soil", q: "What are the latest soil results?" },
    { label: "All the newest results", q: "What are the latest test results?" }
  ];

  // Known, tested questions the AI helper may choose from (never free text).
  function knownQuestions() {
    const qs = D.topics.filter(t => !t.warn).flatMap(t => t.questions || []);
    for (const a of Object.values(D.analytes)) qs.push(`What are the latest ${a.aliases[0]} results?`, `What is ${a.aliases[0]}?`);
    return [...new Set(qs)];
  }

  const Fuzzy = { correct, isVague, CLARIFY, knownQuestions, lev };
  if (typeof module !== "undefined") module.exports = Fuzzy; else root.Fuzzy = Fuzzy;
})(this);

</script>
<script>
// EXTRA FEATURES (Project 3.2): "Did you mean?", librarian help tickets, voice, and the AI helper.
// This file adds to the screens in ../app.js without editing it: it wraps a few of app.js's functions.
// Turn features on or off in config.js. Remove everything by deleting this folder and the
// "EXTRA FEATURES" lines in ../index.html.
(function () {
  const F = KIOSK_FEATURES;
  const baseAsk = askQuestion, baseFooter = footer, baseRenderMain = renderMain, baseRenderStaff = renderStaff;

  S.tickets = S.tickets || [];
  S.ticketSeq = S.ticketSeq || 0;

  const logOnly = (q, kind, tier = 1, category = kind) => {
    S.log.push({ id: S.log.length + 1, session: sessionId, ts: new Date().toISOString(), question: q, tier, category, kind });
    save();
  };
  const askedHTML = q => `<p class="you-asked"><strong>You asked:</strong> ${esc(q)}</p>`;
  const choiceButtons = list => `<div class="choice-grid">${list.map(c =>
    `<button type="button" class="btn primary" data-ask="${esc(c.q)}">${esc(c.label)}</button>`).join("")}</div>`;
  const ticketButton = () => F.helpTicket ? `<button type="button" class="btn" data-feature="ticket">Get help from a librarian</button>` : "";

  // Show a refusal card for a question the safety gate caught (through a typo fix or the AI helper).
  function showReferral(q, category, note) {
    last = { kind: "referral", tier: 3, category, question: q, referral: DATA.referrals[category], dates: { corpusUpdated: DATA.corpusUpdated } };
    logOnly(q, "referral", 3, category);
    showResult((note ? `<div class="banner info"><p>${esc(note)}</p></div>` : "") + resultHTML(last));
  }

  // ---------- The new ask flow ----------
  // 1. Safety gate on the question as typed (inside the normal answer).
  // 2. Safety gate again on the typo-fixed question, so "is it saef" is still refused.
  // 3. Normal answer if it found something. 4. "Did you mean?" for typos.
  // 5. AI helper picks one of the kiosk's known questions. 6. "Which do you mean?" buttons. 7. "We don't have data on that."
  async function ask(q, opts = {}) {
    q = (q || "").trim();
    if (!q || opts.tract || opts.direct) return finish(baseAsk(q, opts), opts);
    const base = Core.answer(q, { suspended: S.suspended });
    if (base.tier === 3) return finish(baseAsk(q, opts), opts);

    if (F.didYouMean) {
      const fixed = Fuzzy.correct(q);
      if (fixed !== q.toLowerCase().replace(/[?.!]+$/, "") && Core.classify(fixed).tier === 3)
        return finish(showReferral(q, Core.classify(fixed).category, `We read your question as: "${fixed}".`), opts);
      const e1 = Core.extract(q), e2 = Core.extract(fixed);
      const gained = (e2.analytes.length + e2.sites.length) > (e1.analytes.length + e1.sites.length);
      if (gained && Core.answer(fixed).kind !== "noAnswer") {
        logOnly(q, "didYouMean");
        return finish(showResult(askedHTML(q) + `<div class="card feature-card"><h2>Did you mean…</h2>
          <p class="big-result">"${esc(fixed)}"</p>
          <div class="choice-grid"><button type="button" class="btn primary" data-ask="${esc(fixed)}" data-direct="1">Yes, show me that</button>
          <button type="button" class="btn" data-ask="${esc(q)}" data-direct="1">No, use what I typed</button></div></div>`), opts);
      }
    }
    if (base.kind !== "noAnswer") return finish(baseAsk(q, opts), opts);

    if (F.ownWords) {
      showResult(askedHTML(q) + `<div class="banner info"><p><strong>Working on it…</strong> Trying to understand your question.</p></div>`);
      const ai = await aiInterpret(q);
      if (ai && ai.safety) return finish(showReferral(q, "safety", "This sounds like a question about safety or health."), opts);
      if (ai && ai.question) {
        baseAsk(ai.question, opts);
        const el = $("#result");
        if (el) el.insertAdjacentHTML("afterbegin", `<div class="banner info ai-note" role="note">
          <p><strong>You typed:</strong> ${esc(q)}</p>
          <p><strong>We understood it as:</strong> ${esc(ai.question)}</p>
          <p class="hint">Understood with help from an AI (Claude), for this demo. The answer below comes from the kiosk's records, not from the AI.</p>
          <div class="row no-print"><button type="button" class="btn" data-feature="not-meant" data-q="${esc(q)}">That's not what I meant</button></div></div>`);
        return finish(null, opts);
      }
    }
    if (F.didYouMean && Fuzzy.isVague(q)) {
      logOnly(q, "clarify");
      return finish(showResult(askedHTML(q) + `<div class="card feature-card"><h2>Which do you mean?</h2>
        <p>Tap one. We'll show the newest results first.</p>${choiceButtons(Fuzzy.CLARIFY)}</div>`), opts);
    }
    return finish(baseAsk(q, opts), opts);
  }
  // Voice questions: read the answer aloud when it is ready.
  function finish(_, opts) { if (opts && opts.voice && F.voice) setTimeout(() => { if (!speaking) speak(); }, 400); }

  // AI helper: sends only the typed question and the list of known questions. Never used for safety questions.
  async function aiInterpret(q) {
    const options = Fuzzy.knownQuestions();
    try {
      const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), 15000);
      const res = await fetch(F.aiHelperUrl, { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: q, options }), signal: ctrl.signal });
      clearTimeout(t);
      if (!res.ok) return null;
      const r = await res.json();
      if (r.safety) return { safety: true };
      if (r.choice === null || r.choice === undefined || r.choice === "") return null; // AI found no match
      const i = Number(r.choice);
      if (!Number.isInteger(i) || i < 0 || i >= options.length) return null;
      const chosen = options[i];
      if (Core.classify(chosen).tier === 3 || Core.answer(chosen).kind === "noAnswer") return null; // double-check
      return { question: chosen };
    } catch { return null; } // helper not running or no internet → normal rules
  }

  window.askQuestion = ask;

  // ---------- Librarian help ticket ----------
  function makeTicket() {
    if (!S.staffed) {
      app.innerHTML = `<h1>Get help from a librarian</h1><div class="card stop"><p class="big-result">Nobody is at the reference desk right now.</p>
        <p>Please come back when the desk is staffed, or print this page and bring it later.</p></div>
        <div class="row no-print"><button type="button" class="btn primary" data-feature="back">‹ Go back</button></div>${footer()}`;
      return;
    }
    S.ticketSeq++;
    const t = { num: S.ticketSeq, ts: new Date().toISOString(), question: last ? last.question : "", status: "waiting" };
    S.tickets.push(t); save();
    app.innerHTML = `<h1>Your help ticket</h1>
      <div class="card ticket"><p>Your number is</p><p class="ticket-num">${t.num}</p>
      <p class="big-result">Show this number to the librarian at the reference desk.</p>
      ${t.question ? `<p><strong>Your question:</strong> ${esc(t.question)}</p>` : ""}
      <p class="hint">The librarian can see your question on their screen. We don't save your name.</p></div>
      <div class="row no-print"><button type="button" class="btn primary" data-action="print">Print my ticket</button>
      <button type="button" class="btn" data-feature="back">‹ Go back</button></div>${footer()}`;
    window.scrollTo(0, 0);
  }

  // ---------- Screen additions ----------
  window.footer = function () {
    const html = baseFooter();
    return F.helpTicket ? html.replace('<button type="button" class="btn" data-action="report">', ticketButton() + '$&') : html;
  };
  window.renderMain = function () {
    baseRenderMain();
    const form = $("#type-form");
    if (!form) return;
    if (F.voice && (window.SpeechRecognition || window.webkitSpeechRecognition))
      form.querySelector(".row").insertAdjacentHTML("afterbegin",
        `<button type="button" class="btn wide mic" data-feature="mic" aria-pressed="false"><span aria-hidden="true">🎤</span> Speak your question</button>`);
    if (F.ownWords) form.insertAdjacentHTML("beforeend",
      `<p class="hint">Demo: if the kiosk doesn't understand your typed question, it may ask an AI (Claude) to help. Please don't type your name or address.</p>`);
  };
  window.renderStaff = function () {
    baseRenderStaff();
    if (!F.helpTicket) return;
    const waiting = S.tickets.filter(t => t.status === "waiting");
    const box = $(".staff > .banner");
    if (box) box.insertAdjacentHTML("afterend", `<section class="card feature-card"><h2>Help tickets (${waiting.length} waiting)</h2>
      <div class="table-wrap"><table><tr><th>Number</th><th>Time</th><th>Question</th><th></th></tr>
      ${S.tickets.slice().reverse().map(t => `<tr><td><strong>${t.num}</strong></td><td>${esc(new Date(t.ts).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }))}</td>
        <td>${esc(t.question) || "–"}</td><td>${t.status === "done" ? "Done" : `<button type="button" class="btn" data-feature="ticket-done" data-num="${t.num}">Mark done</button>`}</td></tr>`).join("")
        || `<tr><td colspan="4">No tickets yet.</td></tr>`}</table></div></section>`);
  };

  // ---------- Voice input ----------
  let rec = null;
  function toggleMic(btn) {
    if (rec) { rec.stop(); return; }
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    rec = new SR(); rec.lang = "en-US"; rec.interimResults = true; rec.maxAlternatives = 1;
    const box = $("#q"); let text = "";
    stopSpeaking();
    btn.setAttribute("aria-pressed", "true"); btn.innerHTML = `<span aria-hidden="true">●</span> Listening… tap to stop`;
    rec.onresult = e => { text = [...e.results].map(r => r[0].transcript).join(" "); if (box) box.value = text; };
    rec.onerror = () => toast("Sorry, the microphone didn't work. Please type your question.");
    rec.onend = () => {
      rec = null;
      btn.setAttribute("aria-pressed", "false"); btn.innerHTML = `<span aria-hidden="true">🎤</span> Speak your question`;
      if (text.trim()) { if (box) box.value = ""; askQuestion(text, { voice: true }); }
    };
    rec.start();
  }

  // ---------- Buttons for the new features ----------
  document.addEventListener("click", e => {
    const el = e.target.closest("[data-feature], [data-direct]");
    if (!el) return;
    if (el.dataset.direct) { e.stopImmediatePropagation(); baseAsk(el.dataset.ask); return; }
    switch (el.dataset.feature) {
      case "ticket": makeTicket(); break;
      case "back": render(); break;
      case "mic": toggleMic(el); break;
      case "ticket-done": { const t = S.tickets.find(x => x.num === Number(el.dataset.num)); if (t) { t.status = "done"; save(); render(); } break; }
      case "not-meant":
        logOnly(el.dataset.q, "aiNotMeant");
        showResult(askedHTML(el.dataset.q) + `<div class="card"><h2>Sorry about that.</h2><p>Try a topic button, or ask a librarian.</p>
          <div class="row no-print">${ticketButton()}</div></div>`);
        break;
    }
  }, true);

  render();
})();

</script>
